[project]
name = "hkdl"
version = "2.0.0"
description = "Local experiment management control plane"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "argcomplete>=3.7,<4",
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
hkdl = "hkdl.interfaces.cli:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["hkdl", "templates"]
namespace = true
source-exclude = [".venv"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<0.12",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
